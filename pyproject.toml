[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-lab"
version = "0.1.0"
description = "RAG Retrieval Lab: side-by-side comparison of retrieval-augmented generation strategies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Valerii Biloskurskyi" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "ruff>=0.6", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
rag-lab = "rag_lab.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "pgvector: integration tests that need a running Postgres with the pgvector extension",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR0917", "SIM905", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
